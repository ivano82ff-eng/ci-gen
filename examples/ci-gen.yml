project: my-service
nodeVersion: "20"

jobs:
  - name: install
    stage: build
    script:
      - npm ci

  - name: build
    stage: build
    script:
      - npm run build

  - name: lint
    stage: test
    script:
      - npm run lint

  - name: test
    stage: test
    script:
      - npm test -- --coverage
    rules:
      - $CI_COMMIT_BRANCH == "main"
      - $CI_PIPELINE_SOURCE == "merge_request_event"

  - name: deploy
    stage: deploy
    script:
      - ./scripts/deploy.sh
    rules:
      - $CI_COMMIT_BRANCH == "main"
