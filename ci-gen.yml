project: ci-gen
nodeVersion: "18"

jobs:
  - name: install
    stage: build
    script:
      - npm ci

  - name: test
    stage: test
    script:
      - npm run lint
      - npm run build
      - npm test
      - npm run generate

  - name: publish
    stage: deploy
    script:
      - npm publish --access public
    rules:
      - $CI_COMMIT_TAG
