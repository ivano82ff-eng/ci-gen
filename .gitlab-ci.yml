# Сгенерировано ci-gen для проекта ci-gen
# Шаблон: node. Не редактируйте вручную — измените ci-gen.yml и запустите ci-gen generate

default:
  image: node:18-alpine

stages:
  - build
  - test
  - deploy

# --- build ---
install:
  stage: build
  image: node:18-alpine
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

# --- test ---
test:
  stage: test
  image: node:18-alpine
  script:
    - npm run lint
    - npm run build
    - npm test
    - npm run generate
  coverage: "/All files\\s*\\|\\s*(\\d+\\.\\d+)/"

# --- deploy ---
publish:
  stage: deploy
  image: node:18-alpine
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - npm publish --access public
  environment:
    name: production
